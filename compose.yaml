services:
  web:
    build: .
    command: python scripts/run_server.py
    environment:
      PORT: "8000"
      TBOT_DASHBOARD_USERNAME: "${TBOT_DASHBOARD_USERNAME:-}"
      TBOT_DASHBOARD_PASSWORD: "${TBOT_DASHBOARD_PASSWORD:-}"
    ports:
      - "8000:8000"
    volumes:
      - tbot-data:/app/data/runtime
    restart: unless-stopped

  worker:
    build: .
    command: python scripts/run_forward_demo.py --interval 60
    environment:
      TWELVE_DATA_API_KEY: "${TWELVE_DATA_API_KEY}"
      FMP_API_KEY: "${FMP_API_KEY:-}"
    volumes:
      - tbot-data:/app/data/runtime
    restart: unless-stopped

volumes:
  tbot-data:
